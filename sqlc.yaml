version: "2"
sql:
  - engine: postgresql
    schema: migrations
    queries: db/queries
    gen:
      go:
        package: dbgen
        out: internal/repository/postgres/dbgen
        sql_package: pgx/v5
        emit_pointers_for_null_types: true
        rename:
          md5: MD5
        overrides:
          - db_type: timestamptz
            go_type:
              import: time
              type: Time
