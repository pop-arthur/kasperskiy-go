name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: make generate
      - name: Check generated code and formatting
        run: |
          test -z "$(gofmt -l cmd internal tests)"
          git diff --exit-code
      - run: go build ./...
      - run: go vet ./...
      - run: go test -race ./...
      - run: make lint
  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: PostgreSQL integration (Go / Testcontainers)
        run: make test-integration
      - name: Migrations and constraints (Go / Testcontainers)
        run: make test-db
      - name: Process and Compose smoke tests (Go)
        run: make test-runtime
