services:
  api:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
    stop_grace_period: 30s
    environment:
      LOG_LEVEL: ${LOG_LEVEL-INFO}
      HTTP_ADDR: 0.0.0.0:8080
      HTTP_READ_HEADER_TIMEOUT: ${HTTP_READ_HEADER_TIMEOUT-5s}
      HTTP_READ_TIMEOUT: ${HTTP_READ_TIMEOUT-10s}
      HTTP_WRITE_TIMEOUT: ${HTTP_WRITE_TIMEOUT-15s}
      HTTP_IDLE_TIMEOUT: ${HTTP_IDLE_TIMEOUT-60s}
      HTTP_SHUTDOWN_TIMEOUT: ${HTTP_SHUTDOWN_TIMEOUT-10s}
      HTTP_MAX_BODY_BYTES: ${HTTP_MAX_BODY_BYTES-1048576}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_DB: ${POSTGRES_DB-threats}
      POSTGRES_USER: ${POSTGRES_USER-threats}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env or the environment}
      POSTGRES_SSLMODE: ${POSTGRES_SSLMODE-disable}
      POSTGRES_MAX_CONNS: ${POSTGRES_MAX_CONNS-10}
      POSTGRES_CONNECT_TIMEOUT: ${POSTGRES_CONNECT_TIMEOUT-5s}
    ports:
      - "127.0.0.1:${API_PORT:-8080}:8080"

  postgres:
    image: postgres:18.6-bookworm@sha256:f1ea2a1a4fb7b68d4836be1fdcb8a6466a89b072158bf9d97663600538c294c5
    environment:
      POSTGRES_DB: ${POSTGRES_DB-threats}
      POSTGRES_USER: ${POSTGRES_USER-threats}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env or the environment}
      TZ: UTC
      PGTZ: UTC
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 5s

  migrate:
    image: migrate/migrate:v4.20.1@sha256:76cc2074cb6642631f34a898ced71e6aeaa6b1a4d78c4daa743275a22e0c5be7
    profiles: ["tools"]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGUSER: ${POSTGRES_USER:-threats}
      PGDATABASE: ${POSTGRES_DB:-threats}
      PGPASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env or the environment}
    volumes:
      - ./migrations:/migrations:ro
    command: ["-path", "/migrations", "-database", "postgres://postgres:5432/?sslmode=disable", "up"]

volumes:
  postgres_data:
